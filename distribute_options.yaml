output: dist/

releases:
  - name: macos
    jobs:
      - name: dev-orbit-macos-dmg
        package:
          platform: macos
          target: dmg
          # Both hooks are no-ops when the signing/notary secrets are absent, so
          # a local `fastforge release --name macos` keeps working unsigned.
          hooks:
            pre: "bash macos/packaging/sign_app.sh"
            post: "bash macos/packaging/notarize_dmg.sh"
